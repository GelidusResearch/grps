output:
  - platform: ledc
    id: pwm_output1
    pin: ${white_led1_pin}
    frequency: 500 Hz  # You can adjust the frequency if needed
    inverted: false     # Set to true if you want inverted PWM signal

light:
  - platform: monochromatic
    name: "PWM Light"
    output: pwm_output1
    restore_mode: ALWAYS_OFF
